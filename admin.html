<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vynk Admin</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #EEF0F3; --surface: #FFFFFF; --raised: #E6E9EE; --line: #D5D9E0;
    --text: #151820; --muted: #596070; --faint: #8A90A0;
    --accent: #85662F; --accent-ink: #FFFFFF; --accent-soft: rgba(133, 102, 47, 0.12);
    --danger: #B4533F; --danger-soft: rgba(180, 83, 63, 0.1); --ok: #3F7A5E; --ok-soft: rgba(63, 122, 94, 0.12);
    --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --sans: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10131A; --surface: #161A23; --raised: #1E2330; --line: #2A3040;
      --text: #ECE7DD; --muted: #8B92A1; --faint: #5D6476;
      --accent: #C4A372; --accent-ink: #10131A; --accent-soft: rgba(196, 163, 114, 0.14);
      --danger: #D47A66; --danger-soft: rgba(212, 122, 102, 0.12); --ok: #8FB59E; --ok-soft: rgba(143, 181, 158, 0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10131A; --surface: #161A23; --raised: #1E2330; --line: #2A3040;
    --text: #ECE7DD; --muted: #8B92A1; --faint: #5D6476;
    --accent: #C4A372; --accent-ink: #10131A; --accent-soft: rgba(196, 163, 114, 0.14);
    --danger: #D47A66; --danger-soft: rgba(212, 122, 102, 0.12); --ok: #8FB59E; --ok-soft: rgba(143, 181, 158, 0.14);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 1rem/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .wrap { width: min(1080px, 100% - 32px); margin-inline: auto; }

  /* Header */
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-top: 16px; }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .wordmark { font: 400 2rem/1 var(--serif); letter-spacing: -0.02em; }
  .brand small { color: var(--muted); font-size: 0.95rem; }
  .account { display: flex; align-items: baseline; gap: 14px; color: var(--muted); font-size: 0.9rem; min-width: 0; }
  .account .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
  .tabs { display: flex; gap: 26px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { background: none; border: 0; padding: 10px 0 12px; color: var(--muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .count { min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-size: 0.75rem; font-weight: 600; text-align: center; }

  main { padding: 28px 0 64px; }
  h1, h2, h3 { margin: 0; }
  .section-title { font: 400 1.9rem/1.1 var(--serif); letter-spacing: -0.01em; margin-bottom: 18px; }
  .muted { color: var(--muted); }
  .small { font-size: 0.88rem; }

  /* Buttons */
  .btn { border: 1px solid transparent; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s ease, opacity .12s ease; }
  .btn:active { transform: scale(0.98); }
  .btn[disabled] { opacity: 0.55; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.secondary { background: var(--surface); border-color: var(--line); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.danger-outline { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.block { width: 100%; padding: 14px 16px; }
  .link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 500; }
  a.btn { text-decoration: none; color: var(--text); }

  /* Sign-in screens */
  .auth { width: min(420px, 100% - 32px); margin: 9vh auto 64px; }
  .auth .wordmark { font-size: 3.6rem; display: block; margin-bottom: 6px; }
  .auth h1 { font: 400 1.7rem/1.15 var(--serif); margin: 22px 0 8px; }
  .auth p { color: var(--muted); margin: 0 0 22px; }
  .field { display: grid; gap: 7px; margin-bottom: 16px; }
  .field > span { color: var(--muted); font-size: 0.9rem; }
  .input, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; font-size: 1rem; }
  .input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .code-input { letter-spacing: 0.5em; text-align: center; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
  .error { color: var(--danger); font-size: 0.92rem; margin: -4px 0 14px; min-height: 0; }
  .steps { padding-left: 1.2em; margin: 0 0 22px; color: var(--muted); }
  .steps li { margin-bottom: 14px; }
  .steps strong { color: var(--text); font-weight: 600; }
  .qr { display: block; width: 168px; height: 168px; background: #fff; padding: 8px; border-radius: 12px; margin: 12px 0; }
  .secret { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .secret code { flex: 1; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font: 500 0.95rem/1.3 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; color: var(--text); }

  /* Overview */
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .stat { padding: 18px 4px 20px; border-bottom: 1px solid var(--line); }
  .stat:nth-child(odd) { padding-right: 16px; }
  .stat b { display: block; font: 400 2.7rem/1 var(--serif); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 0.92rem; }
  .stat.alert b { color: var(--accent); }
  .stat button.link { font-size: 0.88rem; margin-top: 4px; display: block; }
  .panels { display: grid; gap: 40px; margin-top: 44px; }
  .chart { width: 100%; height: auto; display: block; }
  .chart .msg { fill: var(--accent); }
  .chart .sign { fill: var(--muted); opacity: 0.55; }
  .chart .axis { stroke: var(--line); }
  .chart text { fill: var(--faint); font: 500 11px var(--sans); }
  .legend { display: flex; gap: 18px; color: var(--muted); font-size: 0.88rem; margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .feed { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .feed li { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; }
  .feed time { color: var(--faint); font-size: 0.85rem; white-space: nowrap; }
  .empty { color: var(--muted); padding: 28px 0; }

  /* Filters */
  .filters { display: inline-flex; background: var(--raised); border-radius: 99px; padding: 3px; margin-bottom: 22px; flex-wrap: wrap; }
  .filters button { border: 0; background: transparent; padding: 7px 14px; border-radius: 99px; color: var(--muted); font-weight: 500; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  /* Reports */
  .report { padding: 22px 0 24px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
  .report:last-child { border-bottom: 1px solid var(--line); }
  .report-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .report h3 { font: 400 1.45rem/1.2 var(--serif); }
  .report time { color: var(--faint); font-size: 0.85rem; white-space: nowrap; }
  .report .who { margin: 0; }
  .report .who b { font-weight: 600; }
  .quote { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; border-bottom-left-radius: 5px; padding: 12px 14px; max-width: 560px; }
  .quote .label { display: block; color: var(--faint); font-size: 0.8rem; margin-bottom: 6px; }
  .quote p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote img { display: block; max-width: 100%; max-height: 280px; border-radius: 10px; margin-top: 4px; }
  .quote.gone p { color: var(--muted); font-style: italic; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px 14px; color: var(--muted); font-size: 0.9rem; margin: 0; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--accent-soft); color: var(--accent); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }
  .pill.neutral { background: var(--raised); color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .outcome { margin: 0; color: var(--muted); font-size: 0.92rem; }
  .outcome b { color: var(--text); font-weight: 600; }

  /* People */
  .search { display: flex; gap: 10px; margin-bottom: 22px; max-width: 560px; }
  .search .input { flex: 1; }
  .person { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; padding: 16px 0; border-top: 1px solid var(--line); align-items: center; }
  .person:last-child { border-bottom: 1px solid var(--line); }
  .person .name { font-weight: 600; }
  .person .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.88rem; }
  .person .reason { grid-column: 1 / -1; color: var(--muted); font-size: 0.88rem; margin: 0; }

  /* Dialog */
  dialog { border: 0; padding: 0; background: var(--surface); color: var(--text); border-radius: 20px; width: min(460px, calc(100% - 32px)); box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
  dialog::backdrop { background: rgba(6, 8, 12, 0.6); }
  dialog[open] { animation: rise .2s ease-out; }
  .dlg { padding: 24px; display: grid; gap: 14px; }
  .dlg h2 { font: 400 1.6rem/1.15 var(--serif); }
  .dlg p { margin: 0; color: var(--muted); }
  .dlg fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
  .dlg legend { color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
  .choice { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .choice input { accent-color: var(--accent); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  /* Toast and loading */
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 500; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .spinner { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  @media (min-width: 760px) {
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat:nth-child(odd) { padding-right: 4px; }
    .stat { padding-right: 16px; }
    .panels { grid-template-columns: 1.5fr 1fr; }
    .section-title { font-size: 2.2rem; }
  }
  @media (max-width: 560px) {
    .account .who { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <header class="bar" id="bar" hidden>
    <div class="wrap">
      <div class="bar-top">
        <div class="brand"><span class="wordmark">Vynk</span><small>Admin</small></div>
        <div class="account"><span class="who" id="who"></span><button class="link" id="signout" type="button">Sign out</button></div>
      </div>
      <nav class="tabs" role="tablist" aria-label="Admin sections">
        <button class="tab" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button class="tab" role="tab" data-tab="reports" aria-selected="false">Reports <span class="count" id="report-count" hidden>0</span></button>
        <button class="tab" role="tab" data-tab="people" aria-selected="false">People</button>
      </nav>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <dialog id="dialog" aria-modal="true"></dialog>
  <div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(() => {
  // Public project settings (the publishable key is safe to expose).
  const SUPABASE_URL = "https://gusmtidogzrzckltfzuv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_uqpIAMlVsdk7OgG-0u8QVA_gGUJjwIb";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { storageKey: "vynk-admin", persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
  });

  const app = document.getElementById("app");
  const bar = document.getElementById("bar");
  const state = { tab: "overview", filter: "open", email: "", query: "" };

  // ---------- small helpers (user content always goes in as text, never HTML) ----------
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") node.className = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? "" : String(v));
    }
    for (const c of children.flat()) {
      if (c == null || c === false) continue;
      node.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return node;
  }
  const spinner = () => el("div", { class: "spinner", role: "progressbar", "aria-label": "Loading" });
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
  function ago(iso) {
    const s = (new Date(iso).getTime() - Date.now()) / 1000;
    for (const [unit, n] of [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400], ["hour", 3600], ["minute", 60]]) {
      if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), unit);
    }
    return "just now";
  }
  const day = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  const num = (n) => Number(n || 0).toLocaleString();
  function standing(until) {
    if (until === "infinity") return { label: "Banned", tone: "danger" };
    if (until && new Date(until) > new Date()) return { label: `Suspended until ${day(until)}`, tone: "warn" };
    return { label: "Active", tone: "ok" };
  }
  const safeImage = (url) => {
    try {
      const u = new URL(url);
      return u.protocol === "https:" && (u.hostname.endsWith(".klipy.com") || u.hostname === "klipy.com" || u.hostname.endsWith(".supabase.co")) ? url : null;
    } catch { return null; }
  };

  let toastTimer;
  function toast(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  }

  function friendlyAuthError(error) {
    const m = (error && error.message) || "";
    if (/Invalid login credentials/i.test(m)) return "That email and password don’t match.";
    if (/Email not confirmed/i.test(m)) return "Confirm this email address first.";
    if (/banned/i.test(m)) return "This account is suspended.";
    if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute and try again.";
    if (/Invalid TOTP|invalid.*code|expired/i.test(m)) return "That code didn’t work. Check the time on your phone and try the newest code.";
    if (/Failed to fetch|network/i.test(m)) return "No connection. Check your internet and try again.";
    return m || "Something went wrong. Try again.";
  }

  async function api(action, payload) {
    const { data, error } = await sb.functions.invoke("admin", { body: { action, ...(payload || {}) } });
    if (error) {
      let message = "Something went wrong. Try again.";
      let code;
      try {
        const body = await error.context.json();
        message = body.error || message;
        code = body.code;
      } catch {}
      const e = new Error(message);
      e.code = code;
      if (code === "signed_out") { await sb.auth.signOut(); showSignIn(); }
      else if (code === "not_admin") showDenied();
      else if (code === "mfa_required") route();
      throw e;
    }
    return data;
  }

  // ---------- dialog ----------
  function ask({ title, text, confirm, danger, note, notePlaceholder, durations }) {
    return new Promise((resolve) => {
      const d = document.getElementById("dialog");
      let days = "7";
      let done = false;
      const finish = (value) => { if (done) return; done = true; if (d.open) d.close(); resolve(value); };
      const noteField = note ? el("textarea", { rows: 3, maxlength: 200, placeholder: notePlaceholder || "" }) : null;
      const form = el("form", { class: "dlg", method: "dialog" },
        el("h2", {}, title),
        text ? el("p", {}, text) : null,
        durations ? el("fieldset", {},
          el("legend", {}, "How long?"),
          [["1", "1 day"], ["7", "7 days"], ["30", "30 days"], ["0", "Permanent ban"]].map(([v, label]) =>
            el("label", { class: "choice" },
              el("input", { type: "radio", name: "days", value: v, checked: v === "7", onchange: () => { days = v; } }),
              el("span", {}, label)))) : null,
        noteField ? el("label", { class: "field" }, el("span", {}, durations ? "Reason (kept in your activity log)" : "Note (optional)"), noteField) : null,
        el("div", { class: "dlg-actions" },
          el("button", { type: "button", class: "btn ghost", onclick: () => finish(null) }, "Cancel"),
          el("button", { type: "submit", class: `btn ${danger ? "danger" : "primary"}` }, confirm)));
      form.addEventListener("submit", (e) => { e.preventDefault(); finish({ note: noteField ? noteField.value : "", days: Number(days) }); });
      d.replaceChildren(form);
      d.addEventListener("cancel", () => finish(null), { once: true });
      d.showModal();
    });
  }

  async function run(button, work, success) {
    if (button) button.disabled = true;
    try {
      await work();
      if (success) toast(success);
      return true;
    } catch (e) {
      toast(e.message);
      return false;
    } finally {
      if (button) button.disabled = false;
    }
  }

  // ---------- sign-in screens ----------
  function authScreen(title, text, ...body) {
    bar.hidden = true;
    app.replaceChildren(el("section", { class: "auth" },
      el("span", { class: "wordmark" }, "Vynk"),
      el("span", { class: "muted" }, "Admin console"),
      el("h1", {}, title),
      text ? el("p", {}, text) : null,
      ...body));
  }

  function showSignIn() {
    const email = el("input", { class: "input", type: "email", autocomplete: "username", required: true, value: "vynkcontact01@gmail.com" });
    const password = el("input", { class: "input", type: "password", autocomplete: "current-password", required: true });
    const error = el("p", { class: "error", role: "alert" });
    const submit = el("button", { class: "btn primary block", type: "submit" }, "Sign in");
    const form = el("form", {},
      el("label", { class: "field" }, el("span", {}, "Email"), email),
      el("label", { class: "field" }, el("span", {}, "Password"), password),
      error, submit);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      submit.disabled = true;
      const { error: err } = await sb.auth.signInWithPassword({ email: email.value.trim().toLowerCase(), password: password.value });
      submit.disabled = false;
      if (err) { error.textContent = friendlyAuthError(err); return; }
      route();
    });
    authScreen("Sign in", "For Vynk administrators only.", form);
    password.focus();
  }

  function codeForm(label, onCode) {
    const code = el("input", { class: "input code-input", inputmode: "numeric", autocomplete: "one-time-code", maxlength: 6, pattern: "[0-9]{6}", required: true, "aria-label": "6-digit code" });
    const error = el("p", { class: "error", role: "alert" });
    const submit = el("button", { class: "btn primary block", type: "submit" }, label);
    const form = el("form", {}, el("label", { class: "field" }, el("span", {}, "6-digit code"), code), error, submit);
    code.addEventListener("input", () => { code.value = code.value.replace(/\D/g, "").slice(0, 6); });
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      submit.disabled = true;
      const err = await onCode(code.value);
      submit.disabled = false;
      if (err) { error.textContent = friendlyAuthError(err); code.select(); }
    });
    setTimeout(() => code.focus(), 50);
    return form;
  }

  // Supabase returns the QR code as an SVG data URL; re-encode it so characters like "#" can't break it.
  function qrSource(raw) {
    if (typeof raw !== "string" || !raw.startsWith("data:image/svg+xml") || raw.includes(";base64,")) return raw;
    const body = raw.slice(raw.indexOf(",") + 1);
    let svg = body;
    try { svg = decodeURIComponent(body); } catch {}
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  async function showEnroll() {
    authScreen("Set up two-step sign-in", "Admin access needs a code from an authenticator app as well as your password.", spinner());
    const { data: list } = await sb.auth.mfa.listFactors();
    for (const f of ((list && list.all) || []).filter((f) => f.factor_type === "totp" && f.status !== "verified")) {
      await sb.auth.mfa.unenroll({ factorId: f.id });
    }
    const { data, error } = await sb.auth.mfa.enroll({ factorType: "totp", friendlyName: `Vynk admin ${Date.now()}` });
    if (error) {
      authScreen("Set up two-step sign-in", friendlyAuthError(error), el("button", { class: "btn primary block", onclick: showEnroll }, "Try again"));
      return;
    }
    const secret = data.totp.secret;
    const copy = el("button", { class: "btn secondary", type: "button", onclick: async () => {
      try { await navigator.clipboard.writeText(secret); toast("Setup key copied"); } catch { toast("Select the key and copy it"); }
    } }, "Copy");
    authScreen("Set up two-step sign-in", "Admin access needs a code from an authenticator app as well as your password.",
      el("ol", { class: "steps" },
        el("li", {}, el("strong", {}, "Install an authenticator app"), " such as Google Authenticator or Microsoft Authenticator."),
        el("li", {}, el("strong", {}, "Add Vynk to it. "), "On this phone, tap the button below. On a computer, scan the code with your phone. Or type the setup key into the app.",
          el("div", {}, el("a", { class: "btn secondary", href: data.totp.uri, style: "margin-top:10px" }, "Add to authenticator app")),
          el("img", { class: "qr", src: qrSource(data.totp.qr_code), alt: "QR code for your authenticator app" }),
          el("div", { class: "secret" }, el("code", {}, secret), copy)),
        el("li", {}, el("strong", {}, "Enter the 6-digit code"), " your app now shows for Vynk.")),
      codeForm("Turn on two-step sign-in", async (code) => {
        const { error: err } = await sb.auth.mfa.challengeAndVerify({ factorId: data.id, code });
        if (err) return err;
        toast("Two-step sign-in is on");
        route();
      }));
  }

  function showChallenge(factor) {
    authScreen("Enter your code", "Open your authenticator app and enter the 6-digit code for Vynk.",
      codeForm("Continue", async (code) => {
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: factor.id, code });
        if (error) return error;
        route();
      }),
      el("p", { class: "small", style: "margin-top:18px" },
        "Lost your phone? In the Supabase dashboard, open Authentication → Users, select your admin account, remove its authenticator, then sign in here to set it up again."),
      el("button", { class: "link", type: "button", onclick: signOut }, "Use a different account"));
  }

  function showDenied() {
    authScreen("No admin access", "This account isn’t an administrator. Sign in with your Vynk admin account instead.",
      el("button", { class: "btn primary block", onclick: signOut }, "Sign out"));
  }

  async function signOut() {
    await sb.auth.signOut();
    showSignIn();
  }

  async function route() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return showSignIn();
    authScreen("Checking access", null, spinner());
    let who;
    try {
      who = await api("whoami");
    } catch (e) {
      if (e.code === "not_admin" || e.code === "signed_out") return;
      return authScreen("Couldn’t reach Vynk", e.message, el("button", { class: "btn primary block", onclick: route }, "Try again"));
    }
    state.email = who.email;
    if (who.mfa) return showDashboard();
    const { data: factors } = await sb.auth.mfa.listFactors();
    const verified = ((factors && factors.totp) || []).filter((f) => f.status === "verified");
    return verified.length ? showChallenge(verified[0]) : showEnroll();
  }

  // ---------- dashboard ----------
  function showDashboard() {
    bar.hidden = false;
    document.getElementById("who").textContent = state.email;
    selectTab(state.tab);
  }

  function selectTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    if (tab === "overview") renderOverview();
    if (tab === "reports") renderReports();
    if (tab === "people") renderPeople();
  }

  function setReportCount(n) {
    const badge = document.getElementById("report-count");
    badge.textContent = num(n);
    badge.hidden = !n;
  }

  async function refreshCount() {
    try { const { stats } = await api("stats"); setReportCount(stats.open_reports); } catch {}
  }

  function chart(daily) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 640, H = 200, left = 6, right = 6, top = 12, bottom = 26;
    const n = daily.length || 1;
    const max = Math.max(1, ...daily.map((d) => Math.max(d.messages, d.signups)));
    const slot = (W - left - right) / n;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "chart");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Messages and sign-ups per day over the last 14 days");
    const add = (tag, attrs, text) => {
      const node = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      if (text) node.textContent = text;
      svg.append(node);
      return node;
    };
    const h = (v) => (v / max) * (H - top - bottom);
    daily.forEach((d, i) => {
      const x = left + i * slot;
      const mh = h(d.messages), sh = h(d.signups);
      const bar1 = add("rect", { class: "msg", x: x + slot * 0.18, y: H - bottom - mh, width: slot * 0.4, height: Math.max(mh, d.messages ? 2 : 0), rx: 3 });
      bar1.append(Object.assign(document.createElementNS(NS, "title"), { textContent: `${day(d.day)}: ${d.messages} messages` }));
      const bar2 = add("rect", { class: "sign", x: x + slot * 0.6, y: H - bottom - sh, width: slot * 0.22, height: Math.max(sh, d.signups ? 2 : 0), rx: 2 });
      bar2.append(Object.assign(document.createElementNS(NS, "title"), { textContent: `${day(d.day)}: ${d.signups} sign-ups` }));
    });
    add("line", { class: "axis", x1: 0, x2: W, y1: H - bottom + 0.5, y2: H - bottom + 0.5 });
    if (daily.length) {
      const short = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" });
      add("text", { x: left, y: H - 8 }, short(daily[0].day));
      add("text", { x: W - right, y: H - 8, "text-anchor": "end" }, "Today");
    }
    return svg;
  }

  function describe(a) {
    const t = a.target_email || "an account";
    switch (a.action) {
      case "report_dismissed": return "Dismissed a report";
      case "report_resolved": return "Resolved a report";
      case "message_deleted": return `Deleted a message from ${t}`;
      case "user_suspended": return `Suspended ${t}${a.details && a.details.days ? ` for ${a.details.days} day${a.details.days === 1 ? "" : "s"}` : ""}`;
      case "user_banned": return `Banned ${t}`;
      case "user_unsuspended": return `Lifted the suspension on ${t}`;
      default: return a.action;
    }
  }

  async function renderOverview() {
    app.replaceChildren(el("div", { class: "wrap" }, spinner()));
    let data;
    try { data = await api("stats"); } catch (e) { return app.replaceChildren(el("div", { class: "wrap" }, el("p", { class: "empty" }, e.message))); }
    const s = data.stats;
    setReportCount(s.open_reports);
    const stat = (value, label, extra) => el("div", { class: `stat${extra && extra.alert ? " alert" : ""}` },
      el("b", {}, num(value)), el("span", {}, label), extra && extra.action ? extra.action : null);
    const gotoReports = el("button", { class: "link", type: "button", onclick: () => selectTab("reports") }, "Review reports");
    app.replaceChildren(el("div", { class: "wrap" },
      el("h1", { class: "section-title" }, "Overview"),
      el("div", { class: "stats" },
        stat(s.users, "People on Vynk"),
        stat(s.users_7d, "Joined this week"),
        stat(s.active_24h, "Active today"),
        stat(s.messages_24h, "Messages today"),
        stat(s.open_reports, "Open reports", { alert: s.open_reports > 0, action: s.open_reports > 0 ? gotoReports : null }),
        stat(s.suspended, "Suspended accounts")),
      el("p", { class: "muted small", style: "margin-top:14px" },
        `${num(s.messages)} messages in total across ${num(s.chats)} one-to-one chats and ${num(s.groups)} groups.`),
      el("div", { class: "panels" },
        el("section", {},
          el("h2", { class: "section-title" }, "Last 14 days"),
          chart(s.daily || []),
          el("div", { class: "legend" },
            el("span", {}, el("i", { style: "background:var(--accent)" }), "Messages"),
            el("span", {}, el("i", { style: "background:var(--muted);opacity:.55" }), "Sign-ups"))),
        el("section", {},
          el("h2", { class: "section-title" }, "Admin activity"),
          data.recent.length
            ? el("ul", { class: "feed" }, data.recent.map((a) => el("li", {},
                el("span", {}, describe(a)), el("time", { datetime: a.created_at }, ago(a.created_at)))))
            : el("p", { class: "empty" }, "Actions you take on reports and accounts will be listed here.")))));
  }

  function messageBlock(r) {
    if (!r.message_id) {
      return el("div", { class: "quote gone" }, el("span", { class: "label" }, "Report"), el("p", {}, "This report is about the account or chat, not a single message."));
    }
    if (r.message_deleted) {
      return el("div", { class: "quote gone" }, el("span", { class: "label" }, "Reported message"), el("p", {}, "This message has been deleted."));
    }
    const label = el("span", { class: "label" }, `Reported message, sent ${ago(r.message_created_at)}`);
    if (r.message_kind === "image") {
      const src = r.message_image_url && safeImage(r.message_image_url);
      return el("div", { class: "quote" }, label, src ? el("img", { src, alt: "Reported photo", loading: "lazy" }) : el("p", {}, "Photo"), r.message_body ? el("p", {}, r.message_body) : null);
    }
    if (r.message_kind === "gif") {
      const src = r.message_gif_url && safeImage(r.message_gif_url);
      return el("div", { class: "quote" }, label, src ? el("img", { src, alt: "Reported GIF", loading: "lazy" }) : el("p", {}, "GIF"));
    }
    if (r.message_kind === "file") {
      return el("div", { class: "quote" }, label, el("p", {}, `File: ${r.message_attachment_name || "attachment"}`));
    }
    return el("div", { class: "quote" }, label, el("p", {}, r.message_body || ""));
  }

  function suspendFlow(button, userId, name, reportId, after) {
    return async () => {
      const answer = await ask({
        title: `Suspend ${name}?`,
        text: "They’ll be signed out within the hour and can’t send messages, react, start chats or be found by email until the suspension ends.",
        confirm: "Suspend account",
        danger: true,
        durations: true,
        note: true,
        notePlaceholder: "For example: repeated harassment",
      });
      if (!answer) return;
      const ok = await run(button, () => api("suspend", { user_id: userId, days: answer.days, reason: answer.note, report_id: reportId }),
        answer.days ? `${name} is suspended for ${answer.days} day${answer.days === 1 ? "" : "s"}` : `${name} is banned`);
      if (ok) after();
    };
  }

  function reportCard(r) {
    const reported = r.reported_name || r.reported_email || "a deleted account";
    const reporter = r.reporter_name || r.reporter_email || "A deleted account";
    const st = standing(r.reported_suspended_until);
    const where = r.conversation_id ? (r.conversation_is_group ? `In the group “${r.conversation_title || "Untitled"}”` : "In a one-to-one chat") : null;
    const reload = () => { renderReports(); refreshCount(); };

    const card = el("article", { class: "report" },
      el("div", { class: "report-head" }, el("h3", {}, r.reason), el("time", { datetime: r.created_at }, ago(r.created_at))),
      el("p", { class: "who" },
        el("b", {}, reporter), r.reporter_email && r.reporter_name ? ` (${r.reporter_email})` : "", " reported ",
        el("b", {}, reported), r.reported_email && r.reported_name ? ` (${r.reported_email})` : "", where ? `. ${where}.` : "."),
      r.details ? el("p", { class: "muted", style: "margin:0" }, `“${r.details}”`) : null,
      messageBlock(r),
      r.reported_id ? el("p", { class: "facts" },
        el("span", { class: `pill ${st.tone}` }, st.label),
        el("span", {}, `${num(r.reported_report_count)} report${Number(r.reported_report_count) === 1 ? "" : "s"} against ${reported} in total`)) : null);

    if (r.status === "open") {
      const actions = el("div", { class: "actions" });
      if (r.message_id && !r.message_deleted) {
        const del = el("button", { class: "btn danger-outline", type: "button" }, "Delete message");
        del.addEventListener("click", async () => {
          const answer = await ask({ title: "Delete this message?", text: "It will be replaced with “This message was deleted” for everyone in the chat. This also resolves the report.", confirm: "Delete message", danger: true });
          if (!answer) return;
          if (await run(del, () => api("delete_message", { message_id: r.message_id, report_id: r.id }), "Message deleted")) reload();
        });
        actions.append(del);
      }
      if (r.reported_id && st.tone === "ok") {
        const sus = el("button", { class: "btn danger-outline", type: "button" }, "Suspend or ban");
        sus.addEventListener("click", suspendFlow(sus, r.reported_id, reported, r.id, reload));
        actions.append(sus);
      }
      const resolve = el("button", { class: "btn secondary", type: "button" }, "Mark resolved");
      resolve.addEventListener("click", async () => {
        const answer = await ask({ title: "Mark as resolved?", text: "Use this when you’ve handled it another way.", confirm: "Mark resolved", note: true, notePlaceholder: "What did you do?" });
        if (!answer) return;
        if (await run(resolve, () => api("resolve_report", { report_id: r.id, status: "resolved", note: answer.note }), "Report resolved")) reload();
      });
      const dismiss = el("button", { class: "btn ghost", type: "button" }, "Dismiss");
      dismiss.addEventListener("click", async () => {
        const answer = await ask({ title: "Dismiss this report?", text: "Nothing happens to the reported account.", confirm: "Dismiss report", note: true, notePlaceholder: "Why? (optional)" });
        if (!answer) return;
        if (await run(dismiss, () => api("resolve_report", { report_id: r.id, status: "dismissed", note: answer.note }), "Report dismissed")) reload();
      });
      actions.append(resolve, dismiss);
      card.append(actions);
    } else {
      card.append(el("p", { class: "outcome" },
        el("b", {}, r.status === "dismissed" ? "Dismissed" : "Resolved"),
        r.resolved_at ? ` ${ago(r.resolved_at)}` : "", r.action_taken ? `: ${r.action_taken}` : ""));
    }
    return card;
  }

  async function renderReports() {
    const filters = el("div", { class: "filters", role: "group", "aria-label": "Filter reports" },
      [["open", "Open"], ["resolved", "Resolved"], ["dismissed", "Dismissed"], ["all", "All"]].map(([value, label]) =>
        el("button", { type: "button", "aria-pressed": String(state.filter === value), onclick: () => { state.filter = value; renderReports(); } }, label)));
    const list = el("div", {}, spinner());
    app.replaceChildren(el("div", { class: "wrap" }, el("h1", { class: "section-title" }, "Reports"), filters, list));
    try {
      const { reports } = await api("reports", { status: state.filter });
      if (state.filter === "open") setReportCount(reports.length);
      list.replaceChildren(...(reports.length
        ? reports.map(reportCard)
        : [el("p", { class: "empty" }, state.filter === "open" ? "No open reports. When someone reports a message or account in the app, it appears here." : "Nothing here yet.")]));
    } catch (e) {
      list.replaceChildren(el("p", { class: "empty" }, e.message));
    }
  }

  function personRow(p) {
    const st = standing(p.suspended_until);
    const name = p.display_name || p.email;
    const row = el("div", { class: "person" },
      el("div", {}, el("div", { class: "name" }, name), el("div", { class: "muted small" }, p.email)),
      el("div", {}, p.is_admin ? el("span", { class: "pill neutral" }, "Admin") : el("span", { class: `pill ${st.tone}` }, st.label)),
      el("div", { class: "meta" },
        el("span", {}, `Joined ${day(p.created_at)}`),
        el("span", {}, `Last seen ${ago(p.last_seen_at)}`),
        el("span", {}, `${num(p.messages_sent)} messages sent`),
        el("span", {}, `${num(p.reports_against)} report${Number(p.reports_against) === 1 ? "" : "s"} against`),
        p.email_confirmed ? null : el("span", {}, "Email not confirmed")),
      p.suspension_reason && st.tone !== "ok" ? el("p", { class: "reason" }, `Reason: ${p.suspension_reason}`) : null);
    if (!p.is_admin) {
      const actions = el("div", { class: "actions", style: "grid-column:1 / -1" });
      if (st.tone === "ok") {
        const sus = el("button", { class: "btn danger-outline", type: "button" }, "Suspend or ban");
        sus.addEventListener("click", suspendFlow(sus, p.id, name, null, () => search(state.query)));
        actions.append(sus);
      } else {
        const lift = el("button", { class: "btn secondary", type: "button" }, "Lift suspension");
        lift.addEventListener("click", async () => {
          const answer = await ask({ title: `Lift the suspension on ${name}?`, text: "They’ll be able to sign in and use Vynk again straight away.", confirm: "Lift suspension" });
          if (!answer) return;
          if (await run(lift, () => api("unsuspend", { user_id: p.id }), `${name} can use Vynk again`)) search(state.query);
        });
        actions.append(lift);
      }
      row.append(actions);
    }
    return row;
  }

  let resultsBox;
  async function search(q) {
    state.query = q;
    if (!resultsBox) return;
    if (q.trim().length < 2) {
      resultsBox.replaceChildren(el("p", { class: "empty" }, "Type at least two characters of an email address."));
      return;
    }
    resultsBox.replaceChildren(spinner());
    try {
      const { users } = await api("search_users", { query: q });
      resultsBox.replaceChildren(...(users.length ? users.map(personRow) : [el("p", { class: "empty" }, `No accounts match “${q}”.`)]));
    } catch (e) {
      resultsBox.replaceChildren(el("p", { class: "empty" }, e.message));
    }
  }

  function renderPeople() {
    const input = el("input", { class: "input", type: "search", placeholder: "Search by email", "aria-label": "Search by email", value: state.query, autocomplete: "off", autocapitalize: "none", spellcheck: "false" });
    const form = el("form", { class: "search", role: "search" }, input, el("button", { class: "btn primary", type: "submit" }, "Search"));
    resultsBox = el("div", {});
    form.addEventListener("submit", (e) => { e.preventDefault(); search(input.value); });
    app.replaceChildren(el("div", { class: "wrap" },
      el("h1", { class: "section-title" }, "People"),
      el("p", { class: "muted", style: "margin:-8px 0 18px" }, "Find any account by part of its email address."),
      form, resultsBox));
    if (state.query) search(state.query);
    else resultsBox.replaceChildren(el("p", { class: "empty" }, "Results appear here."));
    input.focus();
  }

  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => selectTab(b.dataset.tab)));
  document.getElementById("signout").addEventListener("click", signOut);
  route();
})();
</script>
</body>
